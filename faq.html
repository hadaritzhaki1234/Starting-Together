<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מתחילים יחד — שאלות נפוצות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="sh-left">
    <a href="index.html" class="sh-logo">מתחילים <span>יחד</span></a>
    <div class="sh-header-user">
      <div class="sh-avatar" id="sh-avatar"></div>
      <div class="sh-user-info">
        <div class="sh-user-name" id="sh-name"></div>
        <div class="sh-user-detail"><span id="sh-role"></span></div>
      </div>
    </div>
  </div>
  <div class="sh-right">
    <nav class="sh-nav">
      <a href="dashboard.html">ראשי</a>
      <a href="chats.html">צ'אטים</a>
      <a href="faq.html" class="active">שאלות נפוצות</a>
      <a href="messages.html">הודעות מערכת</a>
    </nav>
    <button class="notif-btn" title="התראות">🔔<span class="notif-dot"></span></button>
    <button class="logout-btn" onclick="logout()">יציאה</button>
  </div>
</header>

<div class="full-page">
  <div class="page-title">
    ❓ שאלות נפוצות
    <a href="dashboard.html">← חזרה ללוח הבקרה</a>
  </div>

  <div class="full-search-wrap">
    <input class="full-search" id="faq-search" placeholder="חיפוש בשאלות ותשובות..." oninput="filterFaqs(this.value)">
    <span class="full-search-icon">🔍</span>
  </div>

  <div id="faq-count" style="font-size:.82rem;color:var(--muted);margin-bottom:12px"></div>
  <div id="faq-list"></div>

  <!-- Add button at BOTTOM -->
  <button class="btn-add-faq" style="margin-top:8px" onclick="openFaqModal()">+ הוספת שאלה נפוצה</button>
</div>

<!-- FAQ Modal -->
<div class="overlay hidden" id="m-faq">
  <div class="modal">
    <div class="modal-hd">
      <div class="modal-title" id="m-faq-title">הוספת שאלה נפוצה</div>
      <button class="modal-x" onclick="closeModal('m-faq')">✕</button>
    </div>
    <div class="modal-bd">
      <div class="mfg"><label>השאלה</label><input type="text" id="faq-q" placeholder="לדוגמה: כיצד ניצור קשר עם המנטור?"></div>
      <div class="mfg"><label>התשובה</label><textarea id="faq-a" placeholder="כתבו את התשובה כאן..."></textarea></div>
    </div>
    <div class="modal-ft">
      <button class="btn-cancel" onclick="closeModal('m-faq')">ביטול</button>
      <button class="btn-save" onclick="saveFaq()">שמירה</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="db.js"></script>
<script src="app.js"></script>
<script>
'use strict';
const U = requireMentor();
if(U) populateHeader();

let faqs = getData('faqs');
let editId = null;

function renderFaqs(items){
  const el=document.getElementById('faq-list');
  const cnt=document.getElementById('faq-count');
  cnt.textContent=`מציג ${items.length} מתוך ${faqs.length} שאלות`;
  if(!items.length){el.innerHTML='<div class="no-results">לא נמצאו שאלות תואמות</div>';return;}
  el.innerHTML=items.map(f=>`
    <div class="faq-item" id="faq-${f.id}">
      <div class="faq-hd">
        <div class="faq-q">${x(f.q)}</div>
        <div class="faq-icons">
          <button class="ibtn" onclick="openFaqModal(${f.id})" title="עריכה">✏️</button>
          <button class="ibtn del" onclick="delFaq(${f.id})" title="מחיקה">🗑️</button>
        </div>
      </div>
      <div class="faq-a">${x(f.a)}</div>
    </div>`).join('');
}

function filterFaqs(q){
  const f=q.trim().toLowerCase();
  renderFaqs(f?faqs.filter(i=>i.q.toLowerCase().includes(f)||i.a.toLowerCase().includes(f)):faqs);
}

function openFaqModal(id=null){
  editId=id;
  document.getElementById('m-faq-title').textContent=id?'עריכת שאלה':'הוספת שאלה נפוצה';
  const f=id?faqs.find(i=>i.id===id):null;
  document.getElementById('faq-q').value=f?f.q:'';
  document.getElementById('faq-a').value=f?f.a:'';
  openModal('m-faq');
  setTimeout(()=>document.getElementById('faq-q').focus(),100);
}

function saveFaq(){
  const q=document.getElementById('faq-q').value.trim();
  const a=document.getElementById('faq-a').value.trim();
  if(!q||!a){toast('אנא מלאו שאלה ותשובה','err');return;}
  if(editId){
    const f=faqs.find(i=>i.id===editId);
    f.q=q;f.a=a;
    toast('השאלה עודכנה ✓','ok');
  }else{
    faqs.unshift({id:Date.now(),q,a});
    toast('השאלה נוספה ✓','ok');
  }
  setData('faqs',faqs);
  closeModal('m-faq');
  renderFaqs(faqs);
  document.getElementById('faq-search').value='';
}

function delFaq(id){
  if(!confirm('למחוק שאלה זו?'))return;
  faqs=faqs.filter(f=>f.id!==id);
  setData('faqs',faqs);
  renderFaqs(faqs);
  toast('השאלה נמחקה','');
}

renderFaqs(faqs);
</script>
</body>
</html>
