<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מתחילים יחד — לוח סטודנט</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.ann-card-collapsed{cursor:pointer;transition:box-shadow .15s}
.ann-card-collapsed:hover{box-shadow:0 2px 10px rgba(0,0,0,.1)}
.ann-reveal-hint{color:var(--teal);font-size:.8rem;font-weight:700}
.ann-card-revealed{cursor:default}
</style>
</head>
<body>

<header class="site-header">
  <div class="sh-left">
    <a href="index.html" class="sh-logo">מתחילים <span>יחד</span></a>
    <div class="sh-header-user">
      <div class="sh-avatar" id="sh-avatar"></div>
      <div class="sh-user-info">
        <div class="sh-user-name" id="sh-name"></div>
        <div class="sh-user-detail"><span id="sh-role"></span></div>
      </div>
    </div>
  </div>
  <div class="sh-right">
    <button class="logout-btn" onclick="logout()">יציאה</button>
  </div>
</header>

<div class="dash-body">

  <!-- COL 1 RIGHT: Chat with mentor(s) -->
  <div class="dash-col">
    <div class="col-head" style="cursor:default;pointer-events:none">💬 החונכים שלי</div>
    <div class="col-body" id="chats-list"></div>
  </div>

  <!-- COL 2 MIDDLE: FAQ (read-only) -->
  <div class="dash-col">
    <a href="student-faq.html" class="col-head">❓ שאלות נפוצות <span class="col-head-arrow">↗</span></a>
    <div class="search-wrap" style="padding:10px 14px 6px">
      <input class="search-input" id="faq-search" placeholder="חיפוש בשאלות..." oninput="filterFaqs(this.value)">
      <span class="search-icon">🔍</span>
    </div>
    <div class="col-body" id="faq-list"></div>
  </div>

  <!-- COL 3 LEFT: Announcements — title only until clicked -->
  <div class="dash-col">
    <div class="col-head" style="cursor:default;pointer-events:none">📢 הודעות מערכת</div>
    <div class="search-wrap" style="padding:10px 14px 6px">
      <input class="search-input" id="ann-search" placeholder="חיפוש בהודעות..." oninput="filterAnns(this.value)">
      <span class="search-icon">🔍</span>
    </div>
    <div class="col-body" id="ann-list"></div>
  </div>

</div>

<!-- Chat Modal -->
<div class="overlay hidden" id="m-chat">
  <div class="modal chat-modal">
    <div class="modal-hd">
      <div>
        <div class="modal-title" id="m-chat-name">שיחה עם החונך</div>
        <div id="m-chat-meta" style="font-size:.72rem;color:var(--muted)"></div>
      </div>
      <button class="modal-x" onclick="closeModal('m-chat')">✕</button>
    </div>
    <div class="modal-bd">
      <div class="chat-msgs" id="chat-msgs"></div>
      <div class="chat-input-row">
        <textarea id="chat-in" placeholder="כתבו הודעה לחונך/ת..." rows="1"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"></textarea>
        <button class="btn-send" onclick="sendMsg()">שליחה ↑</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-database-compat.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
<script src="firebase-config.js"></script>
<script>
'use strict';
const U = requireStudent();
if(!U) throw new Error('no user');
populateHeader();

/* ── State ── */
let allFaqs = getData('faqs');
let allAnns = getData('anns');

/*
  sessions = array of { mentorEmail, mentor, chats, myChat }
  One entry per assigned mentor (1–3).
  activeEmail = which session is currently open in the modal.
*/
let sessions    = [];
let activeEmail = null;

/* Build an empty session record for a mentor email */
function _makeSession(email){
  return { email, mentor: getMentorObjByEmail(email), chats:[], myChat:null };
}

/* Primary mentor namespace (for faqs/anns) */
function _primaryEmail(){ return getMentorEmail(); }

/* ── RENDER: mentor cards in col-1 ── */
function renderChats(){
  const el = document.getElementById('chats-list');
  if(!sessions.length){
    el.innerHTML='<div class="no-results">לא נמצא חונך/ת עבורך</div>'; return;
  }
  el.innerHTML = sessions.map(s => {
    const m   = s.mentor;
    const mc  = s.myChat;
    const ini = m ? m.n.split(' ').slice(0,2).map(w=>w[0]).join('') : '?';
    const unread = mc ? (mc.mentorUnread||0) : 0;
    const preview = mc ? (mc.preview||'לחצו לפתיחת השיחה') : 'טוען…';
    return `
    <div style="border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:10px;background:#fff">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <div class="avatar" style="background:#3EA9A3;width:40px;height:40px;font-size:.8rem;flex-shrink:0">
          ${x(ini)}
        </div>
        <div>
          <div style="font-weight:700;font-size:.92rem">${m?x(m.n):'חונך/ת'}</div>
          <div style="font-size:.72rem;color:var(--muted)">${m?x(m.role||'חונך/ת'):''} · שנה ${m?m.yr:''}</div>
        </div>
        ${unread>0?`<span class="unread-badge" style="margin-right:auto">${unread}</span>`:''}
      </div>
      ${unread>0?`<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;color:var(--red);font-size:.78rem;font-weight:700">
        <span class="chat-new-dot"></span> ${unread} הודעה חדשה
      </div>`:''}
      <div style="font-size:.82rem;color:var(--muted);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${x(preview)}</div>
      <button class="btn-chat" onclick="openChat('${s.email}')">💬 פתיחת שיחה</button>
    </div>`;
  }).join('');
}

/* ── FAQS ── */
function renderFaqs(items){
  const el=document.getElementById('faq-list');
  if(!items||!items.length){el.innerHTML='<div class="no-results">אין שאלות נפוצות עדיין</div>';return;}
  el.innerHTML=items.slice(0,5).map(f=>`
    <div class="faq-item">
      <div class="faq-q" style="font-weight:700;font-size:.88rem;margin-bottom:6px">${x(f.q)}</div>
      <div class="faq-a">${x(f.a)}</div>
    </div>`).join('');
}
function filterFaqs(q){
  const f=q.trim().toLowerCase();
  renderFaqs(f?allFaqs.filter(i=>i.q.toLowerCase().includes(f)||i.a.toLowerCase().includes(f)):allFaqs);
}

/* ── ANNOUNCEMENTS ── */
function renderAnns(items){
  const el=document.getElementById('ann-list');
  if(!items||!items.length){el.innerHTML='<div class="no-results">אין הודעות עדיין</div>';return;}
  el.innerHTML=items.slice(0,5).map(a=>`
    <div class="ann-card ann-card-collapsed" id="ann-${a.id}" onclick="expandAnn(${a.id})">
      <div class="ann-title">${x(a.title||'הודעה חדשה')}</div>
      <div id="ann-body-${a.id}" class="ann-body" style="display:none;margin-top:8px">${x(a.body)}</div>
      <div class="ann-foot" style="margin-top:6px">
        <span class="ann-reveal-hint" id="ann-hint-${a.id}">לחץ לקריאה ›</span>
        <span>${x(a.date)}</span>
      </div>
    </div>`).join('');
}
function expandAnn(id){
  const bodyEl=document.getElementById(`ann-body-${id}`);
  const hint=document.getElementById(`ann-hint-${id}`);
  const card=document.getElementById(`ann-${id}`);
  if(!bodyEl||bodyEl.style.display!=='none')return;
  bodyEl.style.display='block';
  if(hint)hint.style.display='none';
  if(card){card.classList.remove('ann-card-collapsed');card.classList.add('ann-card-revealed');card.onclick=null;}
  const ann=allAnns.find(a=>a.id===id);
  if(!ann)return;
  if(!ann.viewedBy)ann.viewedBy=[];
  if(!ann.viewedBy.includes(U.id)){
    ann.viewedBy.push(U.id);ann.views=(ann.views||0)+1;
    /* view counts go to primary mentor namespace */
    const pe=_primaryEmail();
    if(pe) fbWritePath(`mty/${fbSanitize(pe)}/anns`, allAnns);
  }
}
function filterAnns(q){
  const f=q.trim().toLowerCase();
  renderAnns(f?allAnns.filter(a=>(a.title||'').toLowerCase().includes(f)||a.body.toLowerCase().includes(f)):allAnns);
}

/* ── NOTIFICATION DOT ── */
function _updateNotifDot(){
  const dot=document.querySelector('.notif-dot');
  if(!dot)return;
  const hasUnread=sessions.some(s=>s.myChat&&(s.myChat.mentorUnread||0)>0);
  dot.classList.toggle('active',hasUnread);
}

/* ── CHAT MODAL ── */
function openChat(email){
  const s=sessions.find(s=>s.email===email);
  if(!s||!s.myChat)return;
  activeEmail=email;
  document.getElementById('m-chat-name').textContent=`שיחה עם ${s.mentor?s.mentor.n:'החונך/ת'}`;
  document.getElementById('m-chat-meta').textContent=`${s.mentor?s.mentor.role||'חונך/ת':''} · שנה ${s.mentor?s.mentor.yr:''}`;
  renderMsgs(s.myChat);
  openModal('m-chat');
  /* Mark as read */
  s.myChat.mentorUnread=0;
  fbWritePath(`mty/${fbSanitize(email)}/chats`, s.chats);
  renderChats();
  _updateNotifDot();
  setTimeout(()=>document.getElementById('chat-in').focus(),200);
}
function renderMsgs(c){
  const el=document.getElementById('chat-msgs');
  el.innerHTML=(c.msgs||[]).map(m=>{
    const cls=m.from?(m.from==='student'?'sent':'recv'):(m.sent?'recv':'sent');
    return`<div><div class="bubble ${cls}">${x(m.t)}</div><div class="btime ${cls}">${m.time}</div></div>`;
  }).join('');
  el.scrollTop=el.scrollHeight;
}
function sendMsg(){
  const inp=document.getElementById('chat-in');
  const txt=inp.value.trim();
  if(!txt||!activeEmail)return;
  const s=sessions.find(s=>s.email===activeEmail);
  if(!s||!s.myChat)return;
  const now=new Date();
  const t=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  s.myChat.msgs.push({t:txt,from:'student',time:t});
  s.myChat.preview=txt;
  s.myChat.unread=(s.myChat.unread||0)+1;
  inp.value='';
  fbWritePath(`mty/${fbSanitize(activeEmail)}/chats`, s.chats);
  renderMsgs(s.myChat);
}

/* ── INIT: ensure student has an entry in each mentor's chat list ── */
function _ensureMyChat(s, chatsFromFirebase){
  s.chats = chatsFromFirebase || [];
  s.myChat = s.chats.find(c=>c.id===U.id)||null;
  if(!s.myChat){
    const ini=U.n.split(' ').slice(0,2).map(w=>w[0]).join('');
    s.myChat={_v:CHATS_V,id:U.id,name:U.n,initials:ini,color:'#3EA9A3',
      online:false,hoursAgo:0,preview:'',prog:U.prog,yr:U.yr,msgs:[]};
    s.chats.push(s.myChat);
    fbWritePath(`mty/${fbSanitize(s.email)}/chats`, s.chats);
  }
}

/* ── BOOT ── */
renderFaqs(allFaqs);
renderAnns(allAnns);
document.getElementById('chats-list').innerHTML='<div class="no-results" style="color:var(--muted)">טוען…</div>';

/* Build session list from assigned mentors */
const mentorEmails = getMentorEmails();
sessions = mentorEmails.map(_makeSession);

/* Load each mentor's chat namespace from Firebase, then set up live listeners */
let pending = sessions.length || 1;
const _dec = () => { if(--pending===0) _allLoaded(); };

function _allLoaded(){
  renderChats();
  _updateNotifDot();
  /* Real-time listeners — one per mentor */
  sessions.forEach(s=>{
    fbListenPath(`mty/${fbSanitize(s.email)}/chats`, updated=>{
      const fresh=updated.find(c=>c.id===U.id);
      if(!fresh)return;
      const idx=s.chats.findIndex(c=>c.id===U.id);
      if(idx>=0)s.chats[idx]=fresh; else s.chats.push(fresh);
      s.myChat=s.chats.find(c=>c.id===U.id);
      renderChats();
      _updateNotifDot();
      if(activeEmail===s.email && !document.getElementById('m-chat').classList.contains('hidden'))
        renderMsgs(s.myChat);
    });
  });
}

if(!sessions.length){ _allLoaded(); }
else {
  sessions.forEach(s=>{
    fbSyncPath(`mty/${fbSanitize(s.email)}/chats`, data=>{
      _ensureMyChat(s, data);
      _dec();
    });
  });
}

/* Faqs & anns from primary mentor namespace */
const pe = _primaryEmail();
if(pe){
  fbSyncPath(`mty/${fbSanitize(pe)}/faqs`, data=>{ if(data){allFaqs=data;renderFaqs(allFaqs);} });
  fbSyncPath(`mty/${fbSanitize(pe)}/anns`, data=>{ if(data){allAnns=data;renderAnns(allAnns);} });
}
</script>
</body>
</html>
