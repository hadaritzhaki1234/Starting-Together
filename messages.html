<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מתחילים יחד — הודעות מערכת</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="sh-left">
    <a href="index.html" class="sh-logo">מתחילים <span>יחד</span></a>
    <div class="sh-header-user">
      <div class="sh-avatar" id="sh-avatar"></div>
      <div class="sh-user-info">
        <div class="sh-user-name" id="sh-name"></div>
        <div class="sh-user-detail"><span id="sh-role"></span></div>
      </div>
    </div>
  </div>
  <div class="sh-right">
    <nav class="sh-nav">
      <a href="dashboard.html">ראשי</a>
      <a href="chats.html">צ'אטים</a>
      <a href="faq.html">שאלות נפוצות</a>
      <a href="messages.html" class="active">הודעות מערכת</a>
    </nav>
    <button class="notif-btn" title="התראות">🔔<span class="notif-dot"></span></button>
    <button class="logout-btn" onclick="logout()">יציאה</button>
  </div>
</header>

<div class="full-page">
  <div class="page-title">
    📢 הודעות מערכת
    <a href="dashboard.html">← חזרה ללוח הבקרה</a>
  </div>

  <div class="full-search-wrap">
    <input class="full-search" id="ann-search" placeholder="חיפוש לפי שם סטודנט או תוכן..." oninput="filterAnns(this.value)">
    <span class="full-search-icon">🔍</span>
  </div>

  <div id="ann-list"></div>

  <button class="btn-new-ann" style="margin-top:8px" onclick="openAnnModal()">+ יצירת הודעה חדשה</button>
</div>

<!-- Announcement Modal (create / edit) -->
<div class="overlay hidden" id="m-ann">
  <div class="modal">
    <div class="modal-hd">
      <div class="modal-title" id="m-ann-title">יצירת הודעה חדשה</div>
      <button class="modal-x" onclick="closeModal('m-ann')">✕</button>
    </div>
    <div class="modal-bd">
      <div class="mfg" id="student-fg">
        <label>סטודנט</label>
        <select id="ann-student" style="width:100%;padding:9px 13px;border:1.5px solid var(--border);border-radius:var(--rs);font-family:'Heebo',sans-serif;font-size:.88rem;direction:rtl;outline:none;color:var(--text)"></select>
      </div>
      <div class="mfg" id="title-fg"><label>כותרת</label><input type="text" id="ann-title-input" placeholder="לדוגמה: עדכון לגבי הגשה"></div>
      <div class="mfg"><label>תוכן ההודעה</label><textarea id="ann-b" placeholder="כתבו את ההודעה כאן..."></textarea></div>
    </div>
    <div class="modal-ft">
      <button class="btn-cancel" onclick="closeModal('m-ann')">ביטול</button>
      <button class="btn-save" onclick="saveAnn()">פרסום</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="db.js"></script>
<script src="app.js"></script>
<script>
'use strict';
const U = requireMentor();
if(U) populateHeader();

let anns   = getData('anns');
let editId = null;

function renderAnns(items){
  const el=document.getElementById('ann-list');
  if(!items.length){el.innerHTML='<div class="no-results">לא נמצאו הודעות</div>';return;}
  el.innerHTML=items.map(a=>`
    <div class="ann-card" id="ann-${a.id}">
      <div class="ann-title">${x(a.studentName||a.title||'הודעה')}</div>
      <div class="ann-body">${x(a.body)}</div>
      <div class="ann-foot">
        <span class="ann-views">👁 ${a.views||0} צפיות</span>
        <span>${x(a.date)}</span>
      </div>
      <div class="ann-actions">
        <button class="ibtn" onclick="openAnnModal(${a.id})" title="עריכה">✏️ עריכה</button>
        <button class="ibtn del" onclick="delAnn(${a.id})" title="מחיקה">🗑️ מחיקה</button>
      </div>
    </div>`).join('');
}

function filterAnns(q){
  const f=q.trim().toLowerCase();
  renderAnns(f?anns.filter(a=>(a.studentName||a.title||'').toLowerCase().includes(f)||a.body.toLowerCase().includes(f)):anns);
}

function _populateStudentSel(selectedId){
  const sel=document.getElementById('ann-student');
  const students=DB_STUDENTS.filter(s=>s.prog===U.prog);
  sel.innerHTML=students.map(s=>`<option value="${s.id}" data-name="${s.n}"${s.id===selectedId?' selected':''}>${x(s.n)}</option>`).join('');
}

function openAnnModal(id=null){
  editId=id;
  document.getElementById('m-ann-title').textContent=id?'עריכת הודעה':'יצירת הודעה חדשה';
  const sfg=document.getElementById('student-fg');
  const tfg=document.getElementById('title-fg');
  const a=id?anns.find(i=>i.id===id):null;
  if(id){
    if(sfg)sfg.style.display='none';
    if(tfg)tfg.style.display='none';
    document.getElementById('ann-b').value=a?a.body:'';
  }else{
    if(sfg)sfg.style.display='block';
    if(tfg)tfg.style.display='block';
    _populateStudentSel(null);
    document.getElementById('ann-title-input').value='';
    document.getElementById('ann-b').value='';
  }
  openModal('m-ann');
  setTimeout(()=>document.getElementById(id?'ann-b':'ann-title-input').focus(),100);
}

function saveAnn(){
  const b=document.getElementById('ann-b').value.trim();
  if(!b){toast('אנא כתבו תוכן להודעה','err');return;}
  if(editId){
    const a=anns.find(i=>i.id===editId);
    if(a)a.body=b;
    toast('ההודעה עודכנה ✓','ok');
  }else{
    const sel=document.getElementById('ann-student');
    const studentId=parseInt(sel.value);
    const studentName=sel.options[sel.selectedIndex].getAttribute('data-name');
    const titleEl=document.getElementById('ann-title-input');
    const title=(titleEl&&titleEl.value.trim())||'הודעה חדשה';
    const d=new Date().toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'});
    anns.unshift({id:Date.now(),studentId,studentName,title,body:b,date:d,views:0,viewedBy:[]});
    toast('ההודעה פורסמה ✓','ok');
  }
  setData('anns',anns);
  closeModal('m-ann');
  renderAnns(anns);
  document.getElementById('ann-search').value='';
}

function delAnn(id){
  if(!confirm('למחוק הודעה זו?'))return;
  anns=anns.filter(a=>a.id!==id);
  setData('anns',anns);
  renderAnns(anns);
  toast('ההודעה נמחקה','');
}

renderAnns(anns);
</script>
</body>
</html>
